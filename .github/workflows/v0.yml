name: Compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backup-php81-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate with read-only permissions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: PHP 8.1 with native ZipArchive and mysqli
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          extensions: mysqli, tokenizer, curl, zip, gd
          coverage: none
          tools: none
      - name: Install disposable MariaDB test requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mariadb-server
      - name: PHP 8.1 V7 owned native E2E, swap, and pinned V6.1 compatibility
        run: |
          php -r 'if (!class_exists("ZipArchive") || !extension_loaded("mysqli")) exit(8);'
          python3 tools/check_v7.py --php81 --report "$RUNNER_TEMP/v7-php81.json"
  backup-v6-maintenance-complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact candidate with read-only permissions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: PHP 8.4 with native ZipArchive and mysqli
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mysqli, tokenizer, curl, zip, gd
          coverage: none
          tools: none
      - name: Install disposable MariaDB test requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mariadb-server
      - name: Exact V7 E2E plus full immutable V0-V6.1 historical acceptance
        run: |
          php -r 'if (!class_exists("ZipArchive") || !extension_loaded("mysqli")) exit(8);'
          python3 tools/check_v7.py --report "$RUNNER_TEMP/v7-check.json" --evidence-dir "$RUNNER_TEMP/achbot-v7-evidence"
      - name: Package 65 tracked runtime files, verify exact Git blobs
        run: |
          python3 tools/package_v7.py --output "$RUNNER_TEMP/achbot-v7/achbot-v7-runtime.zip"
          python3 tools/verify_v7_package.py --zip "$RUNNER_TEMP/achbot-v7/achbot-v7-runtime.zip" --manifest "$RUNNER_TEMP/achbot-v7/achbot-v7-runtime.zip.manifest.json"
          cp "$RUNNER_TEMP/v7-check.json" "$RUNNER_TEMP/achbot-v7/v7-check.json"
          cp -R "$RUNNER_TEMP/achbot-v7-evidence" "$RUNNER_TEMP/achbot-v7/evidence"
      - name: Record exact candidate evidence
        run: |
          printf '## AChBot V7 product plans/purchase/provisioning\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'HEAD: `%s`\n\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'Tree: `%s`\n\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
          printf '65 tracked runtime members, immutable historical V0-V6.1 suite, no operator approval/merge/deployment.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/v7-check.json" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact-candidate source-only package and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: achbot-v7-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/achbot-v7/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
