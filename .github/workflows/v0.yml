name: Compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase1-php81-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: PHP 8.1 native compatibility
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          extensions: mysqli, tokenizer, curl, zip, gd
          coverage: none
          tools: none
      - name: Install disposable MariaDB test requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mariadb-server
      - name: V9 global source/bootstrap plus full V8 PHP 8.1 financial history
        run: |
          php -r 'if (!class_exists("ZipArchive") || !extension_loaded("mysqli")) exit(8);'
          python3 tools/check_v9.py --php81 --report "$RUNNER_TEMP/v9-php81.json"
      - name: Record exact PHP 8.1 evidence
        run: |
          printf '## AChBot V9 PHP 8.1 global compatibility\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'HEAD: `%s`\n\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'Tree: `%s`\n\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
          printf 'V9 source-only, inherited financial behavior, no operator acceptance or deployment.\n' >> "$GITHUB_STEP_SUMMARY"
  phase1-php84-full-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout exact candidate without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: PHP 8.4 full acceptance with native extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mysqli, tokenizer, curl, zip, gd
          coverage: none
          tools: none
      - name: Install disposable MariaDB test requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mariadb-server
      - name: Exact V9 global config and source rollback plus complete V0-V8 history
        run: |
          php -r 'if (!class_exists("ZipArchive") || !extension_loaded("mysqli")) exit(8);'
          python3 tools/check_v9.py --report "$RUNNER_TEMP/v9-check.json" --evidence-dir "$RUNNER_TEMP/achbot-v9-evidence"
      - name: Package 92 integrated runtime members from clean V9 HEAD
        run: |
          python3 tools/package_v9.py --output "$RUNNER_TEMP/achbot-v9/achbot-v9-runtime.zip"
          python3 tools/verify_v9_package.py --zip "$RUNNER_TEMP/achbot-v9/achbot-v9-runtime.zip" --manifest "$RUNNER_TEMP/achbot-v9/achbot-v9-runtime.zip.manifest.json"
          cp "$RUNNER_TEMP/v9-check.json" "$RUNNER_TEMP/achbot-v9/v9-check.json"
          cp -R "$RUNNER_TEMP/achbot-v9-evidence" "$RUNNER_TEMP/achbot-v9/evidence"
      - name: Record exact candidate identity and acceptance evidence
        run: |
          printf '## AChBot V9 final Phase 1 global acceptance\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'HEAD: `%s`\n\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'Tree: `%s`\n\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
          printf '92 unchanged V8 runtime source members, original 23 tables, V0-V8 pinned history. No merge, release or deployment approval.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/v9-check.json" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact-candidate archive and acceptance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: achbot-v9-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/achbot-v9/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
