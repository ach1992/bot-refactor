name: Compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: PHP 8.4 test runtime
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mysqli, tokenizer
          coverage: none
          tools: none
      - name: Frozen reference and candidate compatibility
        run: |
          php --version
          git rev-parse HEAD
          python3 tools/check_v1.py --report "$RUNNER_TEMP/v1-check.json"
      - name: Disposable MariaDB prerequisites (ephemeral runner only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mariadb-server
      - name: Existing schema and real transaction checks
        run: |
          python3 tools/test_schema.py --run-disposable --report "$RUNNER_TEMP/v1-schema.json"
      - name: Build identified staging-only runtime package
        run: |
          python3 tools/package_v1.py --output "$RUNNER_TEMP/achbot-v1/achbot-v1-runtime.zip"
          cp "$RUNNER_TEMP/v1-check.json" "$RUNNER_TEMP/v1-schema.json" "$RUNNER_TEMP/achbot-v1/"
      - name: Evidence summary
        run: |
          printf '## Exact-candidate compatibility\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Candidate: `%s`\n\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'Staging-only source; independent review and operator acceptance are separate gates.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/v1-check.json" "$RUNNER_TEMP/v1-schema.json" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain staging package and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: achbot-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/achbot-v1/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
