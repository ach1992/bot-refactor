name: Compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: validation-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.impact.outputs.scope }}
      shards: ${{ steps.impact.outputs.shards }}
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - name: Checkout exact source without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify exact source impact using trusted base code
        id: impact
        run: |
          set -euo pipefail
          # The PR's checkout can modify the classifier. Use original base source.
          base_sha="$(python3 - <<'PYBASE'
          import json, os
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as fp:
              event = json.load(fp)
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              print(event.get("pull_request", {}).get("base", {}).get("sha", ""))
          elif os.environ["GITHUB_EVENT_NAME"] == "push":
              print(event.get("before", ""))
          PYBASE
          )"
          if [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] &&
             git merge-base --is-ancestor "$base_sha" HEAD &&
             git cat-file -e "$base_sha:tools/ci_plan.py"; then
            git show "$base_sha:tools/ci_plan.py" > "$RUNNER_TEMP/trusted-ci-plan.py"
            python3 - "$RUNNER_TEMP/trusted-ci-plan.py" <<'PYTRUST'
          import importlib.util, os, pathlib, sys
          spec = importlib.util.spec_from_file_location("achbot_trusted_ci_plan", sys.argv[1])
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.main(["--github-event", "--github-output", "--output",
                       os.path.join(os.environ["RUNNER_TEMP"], "validation-plan.json")],
                      repo=pathlib.Path.cwd())
          PYTRUST
          else
            # Missing base means full validation; never execute the candidate's classifier.
            python3 - <<'PYFULL'
          import json, os, pathlib, re, subprocess
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as fp:
              event = json.load(fp)
          if event.get("repository", {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("Untrusted repository identity")
          name = os.environ["GITHUB_EVENT_NAME"]
          head = (event.get("pull_request", {}).get("head", {}).get("sha")
                  if name == "pull_request" else
                  event.get("after") if name == "push" else os.environ["GITHUB_SHA"])
          checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          if not isinstance(head, str) or not re.fullmatch(r"[0-9a-f]{40}", head) or checkout != head:
              raise SystemExit("Source identity mismatch on full fallback")
          if name == "push" and os.environ["GITHUB_SHA"] != head:
              raise SystemExit("Push source mismatch")
          result = {"scope":"full", "head":head, "tree":tree, "base":None,
                    "changed_paths":[], "reason":"trusted_base_unavailable",
                    "shards":list(range(1,9))}
          pathlib.Path(os.environ["RUNNER_TEMP"], "validation-plan.json").write_text(
              json.dumps(result, sort_keys=True) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fp:
              fp.write("scope=full\nshards=[1,2,3,4,5,6,7,8]\n")
          print(json.dumps(result, sort_keys=True))
          PYFULL
          fi
      - name: Keep exact-source docs or no-impact classification receipt
        if: steps.impact.outputs.scope == 'docs' || steps.impact.outputs.scope == 'none'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-no-impact-plan
          path: ${{ runner.temp }}/validation-plan.json
          if-no-files-found: error
          retention-days: 14
      - name: Attest a prior successful same-tree PR run on main only
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reuse=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if python3 tools/ci_reuse.py --head "$(git rev-parse HEAD)" --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/ci-reuse-receipt.json"; then
              if python3 - "$RUNNER_TEMP/ci-reuse-receipt.json" <<'PY'
          import json
          import sys
          receipt = json.load(open(sys.argv[1], encoding="utf-8"))
          if receipt.get("reused") is not True:
              raise SystemExit(1)
          PY
              then
                reuse=true
              fi
            fi
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          echo "Validation scope: ${{ steps.impact.outputs.scope }}; accepted source reuse: $reuse" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve original acceptance receipt when reused
        if: steps.reuse.outputs.reuse == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-reuse-receipt
          path: ${{ runner.temp }}/ci-reuse-receipt.json
          if-no-files-found: error
          retention-days: 14

  selected:
    name: selected-current-php85
    needs: [plan]
    if: (needs.plan.outputs.scope == 'source' || needs.plan.outputs.scope == 'cron') && needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup PHP 8.5 only
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mysqli, tokenizer, curl, zip, gd
          coverage: none
          tools: none
      - name: Execute bounded source or Cron checks without claiming full acceptance
        env:
          CHECK_SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          set -euo pipefail
          php -r 'exit(PHP_VERSION_ID >= 80500 && PHP_VERSION_ID < 80600 ? 0 : 1);'
          case "$CHECK_SCOPE" in source|cron) ;; *) echo "Invalid selected scope" >&2; exit 1;; esac
          python3 tools/check_post_v9.py --suite "$CHECK_SCOPE" --report "$RUNNER_TEMP/selected-current.json"
      - name: Upload explicit incomplete-scope report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selected-current-report
          path: ${{ runner.temp }}/selected-current.json
          if-no-files-found: error
          retention-days: 14

  foundation:
    name: current-php85-foundation
    needs: [plan]
    if: needs.plan.outputs.scope == 'full' && needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup PHP 8.5 only
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mysqli, tokenizer, curl, zip, gd
          coverage: none
          tools: none
      - name: Assert PHP runtime and test validation infrastructure
        run: |
          set -euo pipefail
          php -r 'exit(PHP_VERSION_ID >= 80500 && PHP_VERSION_ID < 80600 ? 0 : 1);'
          python3 -m py_compile tools/check_post_v9.py tools/post_v9_suites.py tools/post_v9_shards.py tools/ci_plan.py tools/ci_reuse.py
          PYTHONPATH=tools python3 -m unittest tools.test_ci_plan tools.test_ci_reuse tools.test_post_v9_sharding tools.test_post_v9_validation_modes tools.test_verify_installed_runtime -v
          python3 tools/test_post_v9_zip_timestamp.py -v
      - name: Execute shared current source/payment/privacy foundation
        run: python3 tools/post_v9_shards.py foundation --report "$RUNNER_TEMP/foundation.json"
      - name: Upload version-bound foundation proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php85-foundation
          path: ${{ runner.temp }}/foundation.json
          if-no-files-found: error
          retention-days: 14

  families:
    name: php85-family-${{ matrix.index }}
    needs: [plan]
    if: needs.plan.outputs.scope == 'full' && needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup PHP 8.5 only
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mysqli, tokenizer, curl, zip, gd
          coverage: none
          tools: none
      - name: Install isolated native MariaDB fixtures
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mariadb-server
      - name: Scoped extensions native contract on the existing MariaDB shard
        if: matrix.index == 5
        run: |
          set -euo pipefail
          python3 tools/test_post_v9_scoped_addons.py --run-disposable > "$RUNNER_TEMP/scoped-addons.json"
          cat "$RUNNER_TEMP/scoped-addons.json"
      - name: Scoped API evidence and native PasarGuard mutation acceptance
        if: matrix.index == 5
        run: |
          set -euo pipefail
          python3 tools/test_post_v9_scoped_api_pg.py --run-disposable --report "$RUNNER_TEMP/scoped-api-pg.json"
          cat "$RUNNER_TEMP/scoped-api-pg.json"
      - name: Preserve scoped API and PasarGuard source-real evidence
        if: matrix.index == 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php85-scoped-api-pg
          path: ${{ runner.temp }}/scoped-api-pg.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve standalone scoped-extension evidence
        if: matrix.index == 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php85-scoped-addons
          path: ${{ runner.temp }}/scoped-addons.json
          if-no-files-found: error
          retention-days: 14
      # Run the focused new scoped contract first: repeated schema/admin
      # regressions should fail before the unrelated two-minute shard, while
      # the required eight-family matrix and aggregate stay unchanged.
      - name: Execute one disjoint catalog family on PHP 8.5
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          php -r 'exit(PHP_VERSION_ID >= 80500 && PHP_VERSION_ID < 80600 ? 0 : 1);'
          python3 tools/post_v9_shards.py run --index "$SHARD_INDEX" --count 8 --report "$RUNNER_TEMP/shard-$SHARD_INDEX.json"
      - name: Upload exact family evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php85-shard-${{ matrix.index }}
          path: ${{ runner.temp }}/shard-${{ matrix.index }}.json
          if-no-files-found: error
          retention-days: 14

  php85-validation:
    name: php85-validation
    needs: [plan, selected, foundation, families]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed on missing or contradictory job results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SELECTED_RESULT: ${{ needs.selected.result }}
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          FAMILIES_RESULT: ${{ needs.families.result }}
          SCOPE: ${{ needs.plan.outputs.scope }}
          REUSED: ${{ needs.plan.outputs.reuse }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          env = os.environ
          if env["PLAN_RESULT"] != "success":
              raise SystemExit("Validation plan did not succeed")
          statuses = (env["SELECTED_RESULT"], env["FOUNDATION_RESULT"], env["FAMILIES_RESULT"])
          if env["REUSED"] == "true":
              expected = ("skipped", "skipped", "skipped")
          elif env["REUSED"] == "false" and env["SCOPE"] in ("source", "cron"):
              expected = ("success", "skipped", "skipped")
          elif env["REUSED"] == "false" and env["SCOPE"] in ("docs", "none"):
              expected = ("skipped", "skipped", "skipped")
          elif env["REUSED"] == "false" and env["SCOPE"] == "full":
              expected = ("skipped", "success", "success")
          else:
              raise SystemExit("Unknown acceptance branch")
          if statuses != expected:
              raise SystemExit(f"Missing or failed required evidence: {statuses!r} != {expected!r}")
          PY
      - name: Retrieve selected source/Cron evidence
        if: needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.scope == 'source' || needs.plan.outputs.scope == 'cron')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: selected-current-report
          path: ${{ runner.temp }}/selected-evidence
      - name: Validate selected evidence and source identity
        if: needs.plan.outputs.reuse != 'true' && (needs.plan.outputs.scope == 'source' || needs.plan.outputs.scope == 'cron')
        env:
          EXPECTED_SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/selected-evidence/selected-current.json" <<'PY'
          import json, os, subprocess, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          head = subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip()
          tree = subprocess.check_output(["git","rev-parse","HEAD^{tree}"], text=True).strip()
          assert report.get("complete") is False and report.get("targeted_complete") is True
          assert report.get("scope") == os.environ["EXPECTED_SCOPE"]
          assert report.get("identity",{}).get("head") == head
          assert report.get("identity",{}).get("tree") == tree
          assert report.get("identity",{}).get("dirty") is False
          assert report.get("historical_suite_executed_by_this_script") is False
          assert report.get("source",{}).get("current_additive_migration_separately_tested") is False
          assert "full_current_acceptance" in report.get("omitted",[])
          if os.environ["EXPECTED_SCOPE"] == "cron":
              assert report.get("optional_cron_runner",{}).get("complete") is True
              assert "cron" in report.get("executed", [])
          PY
          cp "$RUNNER_TEMP/selected-evidence/selected-current.json" "$RUNNER_TEMP/selected-validation.json"
      - name: Retrieve trusted lightweight provenance receipt
        if: needs.plan.outputs.scope == 'docs' || needs.plan.outputs.scope == 'none'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-no-impact-plan
          path: ${{ runner.temp }}/lightweight-evidence
      - name: Verify docs/no-impact acceptance without runtime tests
        if: needs.plan.outputs.scope == 'docs' || needs.plan.outputs.scope == 'none'
        env:
          EXPECTED_SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/lightweight-evidence/validation-plan.json" <<'PYLIGHT'
          import json, os, subprocess, sys
          with open(sys.argv[1], encoding="utf-8") as fp:
              receipt = json.load(fp)
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          scope = os.environ["EXPECTED_SCOPE"]
          if (scope not in ("docs", "none") or receipt.get("scope") != scope
                  or receipt.get("head") != head or receipt.get("tree") != tree
                  or receipt.get("shards") != []
                  or not isinstance(receipt.get("changed_paths"), list)):
              raise SystemExit("Untrusted or mismatched lightweight acceptance receipt")
          if scope == "docs" and (
                  receipt.get("reason") != "ordinary_docs_only"
                  or not receipt["changed_paths"]):
              raise SystemExit("Documentation change not proven")
          if scope == "none" and (
                  receipt.get("reason") != "no_effective_changes"
                  or receipt["changed_paths"]):
              raise SystemExit("No-impact tree identity not proven")
          print(f"Attested {scope}: HEAD={head}, tree={tree}; PHP/native tests not executed")
          PYLIGHT
      - name: Retrieve full PHP 8.5 foundation
        if: needs.plan.outputs.reuse != 'true' && needs.plan.outputs.scope == 'full'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: php85-foundation
          path: ${{ runner.temp }}/foundation-evidence
      - name: Retrieve all eight disjoint PHP 8.5 families
        if: needs.plan.outputs.reuse != 'true' && needs.plan.outputs.scope == 'full'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: php85-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/family-evidence
      - name: Strictly aggregate all current PHP 8.5 evidence
        if: needs.plan.outputs.reuse != 'true' && needs.plan.outputs.scope == 'full'
        run: |
          set -euo pipefail
          python3 tools/post_v9_shards.py aggregate --source "$RUNNER_TEMP/foundation-evidence/foundation.json" --reports "$RUNNER_TEMP/family-evidence" --report "$RUNNER_TEMP/post-v9-acceptance.json"
      - name: Retrieve read-only prior PR acceptance receipt
        if: needs.plan.outputs.reuse == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-reuse-receipt
          path: ${{ runner.temp }}/reuse-evidence
      - name: Validate reuse receipt is explicit and matches current main
        if: needs.plan.outputs.reuse == 'true'
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/reuse-evidence/ci-reuse-receipt.json" <<'PY'
          import json, subprocess, sys
          receipt = json.load(open(sys.argv[1], encoding="utf-8"))
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          assert receipt.get("reused") is True
          assert receipt.get("repository") == "ach1992/bot-refactor"
          assert receipt.get("main_head") == head
          assert receipt.get("main_tree") == tree
          PY
      - name: Rebuild and verify current HEAD source package, never reuse a prior ZIP
        if: needs.plan.outputs.scope != 'docs' && needs.plan.outputs.scope != 'none'
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/achbot-current"
          mkdir -p "$bundle"
          python3 tools/package_post_v9.py create --output "$bundle/runtime.zip"
          python3 tools/package_post_v9.py verify --zip "$bundle/runtime.zip" --manifest "$bundle/runtime.zip.manifest.json"
          for id in 001_marzban_panel_group_id 003_payment_attempts 004_automatic_renewal_attempts 005_wallet_adjustments 006_payment_message_refs 007_service_effects 008_referral_awards 009_bank_buy_invoice_claims 011_provider_identity 012_shared_provider_storage 013_remove_obsolete_order_columns 014_api_payment_evidence 015_scoped_addons; do
            cp "migrations/post-v9/$id.sql" "$bundle/$id.sql"
            (cd "$bundle" && sha256sum "$id.sql" > "$id.sha256")
          done
          mkdir -p "$bundle/optional-cleanup/tools" "$bundle/optional-cleanup/migrations/post-v9"
          cp tools/cleanup_post_v9.php "$bundle/optional-cleanup/tools/"
          cp migrations/post-v9/010_cleanup_manifest.json "$bundle/optional-cleanup/migrations/post-v9/"
          (cd "$bundle/optional-cleanup" && sha256sum tools/cleanup_post_v9.php migrations/post-v9/010_cleanup_manifest.json > SHA256SUMS)
          cp migrations/post-v9/legacy_rc4_nowpayments_import.sql "$bundle/legacy-rc4-import.sql"
          (cd "$bundle" && sha256sum legacy-rc4-import.sql > legacy-rc4-import.sha256)
          if [[ -f "$RUNNER_TEMP/post-v9-acceptance.json" ]]; then
            cp "$RUNNER_TEMP/post-v9-acceptance.json" "$bundle/post-v9-acceptance.json"
          elif [[ -f "$RUNNER_TEMP/selected-validation.json" ]]; then
            cp "$RUNNER_TEMP/selected-validation.json" "$bundle/post-v9-targeted.json"
          elif [[ -f "$RUNNER_TEMP/reuse-evidence/ci-reuse-receipt.json" ]]; then
            cp "$RUNNER_TEMP/reuse-evidence/ci-reuse-receipt.json" "$bundle/ci-reuse-receipt.json"
          else
            echo "Missing actual acceptance or honest reuse evidence" >&2
            exit 1
          fi
      - name: Record exact-head validation category and timing
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
          REUSED: ${{ needs.plan.outputs.reuse }}
        run: |
          set -euo pipefail
          echo "## AChBot PHP 8.5 current-source verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Head: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Tree: $(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
          echo "Selected scope: $SCOPE, source-pipeline reuse: $REUSED" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SCOPE" == docs || "$SCOPE" == none ]]; then
            echo "Trusted Git provenance only: no PHP tests, native shards, MariaDB or runtime package executed." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Only complete eight-family PHP 8.5 aggregation is full current-runtime acceptance. Prior frozen V0-V9 PHP 8.1/8.4 execution results remain separate historical evidence; not executed or relabelled by this workflow. No live bot, provider, or financial operation is authorized." >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$RUNNER_TEMP/post-v9-acceptance.json" ]]; then
            python3 - "$RUNNER_TEMP/post-v9-acceptance.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          meta=data.get("validation",{})
          print("Family seconds: "+json.dumps(meta.get("family_seconds",{}),sort_keys=True))
          print("Maximum family seconds: "+str(meta.get("maximum_family_seconds")))
          PY
          fi
      - name: Upload independently rebuilt exact-HEAD source and truthful evidence
        if: needs.plan.outputs.scope != 'docs' && needs.plan.outputs.scope != 'none'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: achbot-current-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/achbot-current/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
